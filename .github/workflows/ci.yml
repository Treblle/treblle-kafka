name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Retry transient Maven Central failures (429 rate limits, connection resets) with backoff.
  MAVEN_ARGS: -Daether.connector.http.retryHandler.count=6 -Daether.connector.http.retryHandler.interval=10000

jobs:
  # One job downloads everything every other job needs, then saves it as the shared cache.
  # Without this, the matrix jobs all hit Maven Central at once and get rate-limited (HTTP 429),
  # and whichever job finishes first saves a cache missing what the others need.
  warm-cache:
    name: Warm Maven cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('pom.xml', '.github/workflows/ci.yml') }}
      - name: Build plugins and 3.9.0 dependencies
        run: mvn -B verify
      - name: kafka-clients 3.0.0 dependencies
        run: mvn -B dependency:resolve -Dkafka.version=3.0.0
      - name: kafka-clients 4.1.0 dependencies
        run: mvn -B dependency:resolve -Dkafka.version=4.1.0

  test:
    name: Java ${{ matrix.java }} / kafka-clients ${{ matrix.kafka }}
    needs: warm-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']
        # Oldest supported, the version the release is compiled against, and the newest.
        kafka: ['3.0.0', '3.9.0', '4.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('pom.xml', '.github/workflows/ci.yml') }}
      - name: Build and test
        run: mvn -B verify -Dkafka.version=${{ matrix.kafka }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java${{ matrix.java }}-kafka${{ matrix.kafka }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  # The published jar is compiled against 3.9.0. Prove that exact build works on other clients.
  binary-compatibility:
    name: 3.9.0 build on kafka-clients ${{ matrix.kafka }}
    needs: warm-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kafka: ['3.0.0', '4.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('pom.xml', '.github/workflows/ci.yml') }}
      - name: Compile against 3.9.0
        run: mvn -B compile
      - name: Test those classes against ${{ matrix.kafka }}
        run: mvn -B test -Dkafka.version=${{ matrix.kafka }} -Dmaven.main.skip=true
