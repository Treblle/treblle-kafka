name: Release to Maven Central

# Publishes to Maven Central whenever a v* tag is pushed.
# Guard steps ensure the tagged commit lives on the release branch (main) and that the tag
# matches the version in pom.xml.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on the release branch (main)
        run: |
          if git branch -r --contains "$GITHUB_SHA" | grep -qE '^\s*origin/main$'; then
            echo "Tag $GITHUB_REF_NAME is on main — proceeding with publish."
          else
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on the release branch (main). Skipping publish."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Ensure tag matches the pom.xml version
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom.xml version $VERSION."
            exit 1
          fi

      - name: Deploy with Maven
        run: mvn -B clean deploy -Pci-cd
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
